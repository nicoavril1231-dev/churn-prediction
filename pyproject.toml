[project]
name = "churn-prediction"
version = "0.1.0"
description = "End-to-end churn prediction pipeline — sklearn, XGBoost, MLflow, FastAPI, Docker, CI."
authors = [{ name = "Nicolas Avril", email = "nicolas.avril.auguste@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mlflow>=2.14",
    "joblib>=1.4",
    "pyarrow>=15",
    "requests>=2.31",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "httpx>=0.27",
]

[project.scripts]
churn-train = "churn.train:main"
churn-download = "churn.data:download"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# N806: ML convention uses X_train/X_test (uppercase X for matrices).
# E501: line length is enforced by formatter, not linter.
ignore = ["E501", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=churn --cov-report=term-missing"
