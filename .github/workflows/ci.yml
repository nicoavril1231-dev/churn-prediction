name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # Pin to a full version tag — astral-sh/setup-uv does not maintain a
        # `v8` major-version alias (only v7 and below have it). Using `@v8`
        # makes the runner fail "Set up job" with a 404.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests api

      - name: Download dataset & train smoke model
        run: |
          python -m churn.data
          python -m churn.train --model logreg

      - name: Run pytest with coverage
        run: pytest --cov=churn --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          retention-days: 7

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: churn-prediction:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run --rm -d -p 8000:8000 --name churn-ci churn-prediction:ci
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Service healthy"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
          docker stop churn-ci
